version: 1
formatters:
  simple:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  detailed:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(module)s:%(lineno)d - %(message)s'
    encoding: 'utf-8'  # 添加编码设置

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stdout
    encoding: 'utf-8'  # 添加编码设置
    
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: app.log
    maxBytes: 10485760
    backupCount: 5
    encoding: 'utf-8'  # 添加编码设置

  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: errors.log
    maxBytes: 10485760
    backupCount: 5
    encoding: 'utf-8'  # 添加编码设置

loggers:
  src:
    level: DEBUG
    handlers: [console, file, error_file]
    propagate: no

root:
  level: INFO
  handlers: [console, file]

  # 时域分析参数
time_channels: 8
time_sampling_rate: 500000
time_window_size: 1000

