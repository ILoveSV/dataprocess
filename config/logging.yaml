version: 1
disable_existing_loggers: False

formatters:
  standard:
    format: '%(asctime)s-%(levelname)s-[%(filename)s:%(lineno)d]-%(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

handlers:
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: standard
    filename: app.log 
    maxBytes: 10485760        # 10MB
    backupCount: 5
    encoding: utf8

  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

loggers:
  data_process:
    level: DEBUG
    handlers: [file, console]
    propagate: no

root:
  level: INFO
  handlers: [console]